server:
  port: 8080
  servlet:
    context-path: /ecommerce

spring:
  application:
    name: ecommerce

  cache:
    type: redis

  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/e-commerce}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
