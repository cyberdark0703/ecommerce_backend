
name: E-commerce CI

# Những sự kiện kích hoạt workflow
on:
  push:
    branches:
      - master
      - feature/deployment
  pull_request:
    branches:
      - master

# Các công việc cần thực hiện
jobs:
  build:
    # Máy ảo GitHub sử dụng để chạy workflow
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy source code từ repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Build và chạy test
      - name: Build and Test
        run: mvn clean verify
